# Stage 2 go/no-go evidence (design §12.1, §12.2).
#
# stress: 20 separate R processes per OS each create and tear down 200
# thread pools and run 200 short parallel regions through each, on the
# std::thread / std::mutex / std::condition_variable primitives zufft's
# pool will use. A hang (SciPy's reason for disabling ducc0's threads on
# MinGW-w64) fails the job at its timeout.
#
# marshal: builds the portable copy path of the complex boundary and runs
# the test suite on it, so the fallback keeps working.
on:
  push:
    branches: [main, master]
    paths-ignore: ['**.md', '.agents/**', '_pkgdown.yml', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', '.agents/**', '_pkgdown.yml', 'docs/**']

name: portability

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: thread stress (${{ matrix.os }})
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # bash, not PowerShell: there `R` is an alias of Invoke-History.
      - name: install zufft
        shell: bash
        run: R CMD INSTALL .
      - name: 20 consecutive stress runs
        shell: bash
        timeout-minutes: 25
        run: |
          for i in $(seq 1 20); do
            Rscript -e 'nt <- 4L; t <- system.time(x <- zufft:::zff_thread_stress(nt, 200L, 200L)); stopifnot(x == 200 * 200 * nt * (nt + 1) / 2); cat(sprintf("run %s: %.2f s\n", commandArgs(TRUE)[1], t[["elapsed"]]))' "$i"
          done

  pool:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: pool stress (${{ matrix.os }})
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # bash, not PowerShell: there `R` is an alias of Invoke-History.
      - name: install zufft
        shell: bash
        run: R CMD INSTALL .
      - name: 20 processes of 500 threaded transforms on zufft's pool
        shell: bash
        timeout-minutes: 25
        run: |
          for i in $(seq 1 20); do
            Rscript -e 'library(zufft); set.seed(1); m <- matrix(rnorm(256 * 256), 256); want <- fft_c2c(m, axes = 1); t <- system.time(for (k in 1:500) stopifnot(identical(fft_c2c(m, axes = 1, workers = 4), want))); cat(sprintf("run %s: %.2f s, pool %d\n", commandArgs(TRUE)[1], t[["elapsed"]], zufft_info()$pool_size))' "$i"
          done

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            flags: -march=native
            min_width: 4
          - os: macos-latest
            flags: -mcpu=native
            min_width: 2
    runs-on: ${{ matrix.os }}
    name: native build via ZUFFT_CXXFLAGS (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # The README's opt-in native build: the flag must reach every C++
      # compile, and the result must stay correct. Not on Windows, where
      # Makevars.win has no hook (AVX code from Rtools' GCC crashed).
      - name: install with ZUFFT_CXXFLAGS
        shell: bash
        env:
          ZUFFT_CXXFLAGS: ${{ matrix.flags }}
        run: |
          R CMD INSTALL --preclean . 2>&1 | tee install.log
          n=$(grep -c -- "$ZUFFT_CXXFLAGS" install.log || true)
          echo "compile lines carrying $ZUFFT_CXXFLAGS: $n"
          [ "$n" -ge 10 ] || { echo "::error::ZUFFT_CXXFLAGS did not reach the compiler"; exit 1; }
      - name: wider vectors, correct results
        shell: bash
        env:
          MIN_WIDTH: ${{ matrix.min_width }}
        run: |
          Rscript -e '
            info <- zufft::zufft_info()
            str(info[c("simd_backend", "simd_width", "fma", "fp_contract")])
            stopifnot(info$simd_width >= as.integer(Sys.getenv("MIN_WIDTH")))
            set.seed(1)
            z <- complex(real = rnorm(1009), imaginary = rnorm(1009))
            stopifnot(isTRUE(all.equal(zufft::fft_c2c(z), stats::fft(z))))
            m <- matrix(rnorm(512 * 64), 512)
            stopifnot(isTRUE(all.equal(zufft::fft_c2r(zufft::fft_r2c(m), n = dim(m)), m)))
          '

  marshal:
    runs-on: ubuntu-latest
    name: complex marshal path
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::withr
      - name: build with ZFF_COMPLEX_MARSHAL
        run: |
          mkdir -p ~/.R
          echo 'CXX17FLAGS += -DZFF_COMPLEX_MARSHAL' >> ~/.R/Makevars
          R CMD INSTALL .
      - name: tests on the marshal path
        shell: Rscript {0}
        run: |
          stopifnot(zufft::zufft_info()$complex_path == "marshal")
          testthat::test_local(".", load_package = "installed", stop_on_failure = TRUE)
