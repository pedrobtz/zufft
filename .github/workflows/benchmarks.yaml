# Benchmarks of design §11 on a GitHub-hosted Linux x86-64 runner, against
# fftwtools on the distribution's FFTW. On demand only: add the `benchmark`
# label to a pull request, or dispatch the workflow. Shared runners are
# noisy, so ratios matter more than absolute times. The results land in the
# job summary and as an artifact; bench/RESULTS.md records them.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

name: benchmarks

permissions:
  contents: read

jobs:
  linux:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'benchmark'
    runs-on: ubuntu-latest
    name: benchmarks (ubuntu-latest)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: FFTW for fftwtools and fftw
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::bench, any::fftwtools, any::fftw
      - name: install zufft
        run: R CMD INSTALL .
      - name: run the grid
        run: |
          tools/run-benchmarks --label "Linux x86-64 (GitHub ubuntu-latest runner)" \
            --out bench/results-linux-x86_64.md
          cat bench/results-linux-x86_64.md >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          lscpu | head -20 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks-linux-x86_64
          path: bench/results-linux-x86_64.*
