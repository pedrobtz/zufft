# Benchmarks of design §11 on a GitHub-hosted Linux x86-64 runner, against
# fftwtools on the distribution's FFTW. On demand only: add the `benchmark`
# label to a pull request, or dispatch the workflow. Shared runners are
# noisy, so ratios matter more than absolute times. The results land in the
# job summary and as an artifact; bench/RESULTS.md records them.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

name: benchmarks

permissions:
  contents: read

jobs:
  linux:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'benchmark'
    strategy:
      fail-fast: false
      matrix:
        # portable: CRAN's flags (SSE2). native: the opt-in build of design
        # §12.3, ZUFFT_CXXFLAGS=-march=native (AVX2 on the runner).
        build: [portable, native]
    runs-on: ubuntu-latest
    name: benchmarks (ubuntu-latest, ${{ matrix.build }})
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: FFTW for fftwtools and fftw
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::bench, any::fftwtools, any::fftw
      - name: install zufft
        env:
          BUILD: ${{ matrix.build }}
        run: |
          # The README's native build: ZUFFT_CXXFLAGS reaches only zufft.
          if [ "$BUILD" = native ]; then
            export ZUFFT_CXXFLAGS=-march=native
          fi
          R CMD INSTALL .
          Rscript -e 'str(zufft::zufft_info()[c("simd_backend", "simd_width", "fma")])' 
      - name: run the grid
        env:
          BUILD: ${{ matrix.build }}
        run: |
          tools/run-benchmarks --label "Linux x86-64 (GitHub ubuntu-latest runner, $BUILD build)" \
            --workers 1,2 --out "bench/results-linux-x86_64-$BUILD.md"
          cat "bench/results-linux-x86_64-$BUILD.md" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          lscpu | head -20 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks-linux-x86_64-${{ matrix.build }}
          path: bench/results-linux-x86_64-${{ matrix.build }}.*
